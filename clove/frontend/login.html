<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CLOVE Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand">CLOVE</div>
    <h1>Welcome back</h1><p class="muted">Sign in to continue.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Password<input id="password" type="password" required></label>
      <button class="primary full" type="submit">Login</button>
    </form>
    <p id="message" class="message"></p>
    <p class="muted center">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>
  <script src="js/api.js?v=1.2"></script><script src="js/auth.js?v=1.2"></script>
</body></html>
